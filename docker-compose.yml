# Vantage — local stack (portable; runs on any Docker host).
# Slice 0 brings up Keycloak + Redis first to de-risk auth:
#     docker compose up keycloak redis
# db init mounts (db/schema.sql, db/seed.sql) come from the data track — they land on merge.
# The api service is added once app/ is built (next slice).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vantage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-vantage}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vantage}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Redis Stack (server, headless) — a strict superset of plain Redis. Session memory uses
    # only core commands (unaffected); the extra RediSearch + RedisJSON modules back the
    # LangGraph durable checkpointer for the briefing's HITL pause/resume (ADR-008). The
    # `-server` variant omits RedisInsight, which would otherwise expose 8001 and collide
    # with the MCP service. Same port 6379, same `redis-cli ping` healthcheck.
    image: redis/redis-stack-server:latest
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  mcp:
    # The custom MCP server (ADR-003): exposes the named, RBAC-checked tools over
    # Streamable HTTP. Only this service holds the DB credentials. Built from the repo
    # root so it can reuse app/{security,db,tools}.py (see mcp_server/Dockerfile).
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    environment:
      DATABASE_URL: postgresql://vantage:changeme@db:5432/vantage
      KEYCLOAK_URL: http://keycloak:8080                       # internal — JWKS/backchannel
      KEYCLOAK_ISSUER: http://localhost:8080/realms/vantage    # public — matches token `iss`
      KEYCLOAK_REALM: vantage
      MCP_PORT: 8001
      MCP_RESOURCE_URL: http://localhost:8001/mcp
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8001:8001"   # published for dev smoke-testing; container-to-container in prod

  api:
    build: ./app
    environment:
      KEYCLOAK_URL: http://keycloak:8080            # internal — backchannel (token exchange, JWKS)
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}  # frontchannel — what the browser hits
      KEYCLOAK_ISSUER: http://localhost:8080/realms/vantage
      KEYCLOAK_REALM: vantage
      KEYCLOAK_CLIENT_ID: vantage-api
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-vantage-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}        # set true when served behind HTTPS (Codespaces, prod)
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      REDIS_URL: redis://redis:6379/0
      MCP_URL: http://mcp:8001/mcp          # the agent reaches tools only via the MCP server
      AUTHORED_SKILLS_DIR: /data/skills     # user-authored skills (Flow 1) on a persistent volume
      # Model-agnostic via OpenAI SDK + base_url (ADR-001). Swap providers by changing these.
      LLM_BASE_URL: https://api.anthropic.com/v1/
      LLM_MODEL: claude-sonnet-4-6
      LLM_API_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # back-compat fallback if LLM_API_KEY unset
      # Bonus tracing (ADR-008): OpenTelemetry -> self-hosted Phoenix (no egress); LangSmith
      # is opt-in and only activates when LANGSMITH_API_KEY is provided.
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      PHOENIX_PROJECT_NAME: vantage
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-vantage}
    # No DATABASE_URL: the API holds no database access — tools run behind the MCP server (ADR-003).
    volumes:
      - skills_data:/data/skills            # authored skills survive a container rebuild
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      mcp:
        condition: service_started
      phoenix:
        condition: service_started
    ports:
      - "8000:8000"

  phoenix:
    # Self-hosted observability (ADR-008 bonus tracing): the Phoenix UI + an OTLP collector.
    # The api exports spans for the reactive loop and the briefing graph here over OTLP — no
    # trace data leaves the host (the enterprise-safe default; LangSmith is the opt-in extra).
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # Phoenix UI + OTLP/HTTP collector (/v1/traces)

volumes:
  pgdata:
  skills_data:   # user-authored skills (Flow 1)
